    <path d="M32 19L47 27.5L32 36L17 27.5Z" fill="#FFE08A"/>
    <path d="M17 27.5L32 36V53L17 44.5Z" fill="#FFC83D"/>
    <path d="M32 36L47 27.5V44.5L32 53Z" fill="#E39F00"/>
    <path d="M27.1 21.75L42.1 30.25L36.9 33.25L21.9 24.75Z" fill="#2F5BFF"/>
    <path d="M36.9 33.25L42.1 30.25V47.27L36.9 50.22Z" fill="#2347D9"/>
  </g>
</svg>
