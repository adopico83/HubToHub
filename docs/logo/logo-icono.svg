<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 64 64" fill="none" role="img" aria-label="HubToHub">
  <defs>
    <linearGradient id="fondo" x1="8" y1="0" x2="56" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#223C8C"/>
      <stop offset="1" stop-color="#0E1A3A"/>
    </linearGradient>
    <linearGradient id="ruta" x1="8" y1="52" x2="56" y2="12" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7FA0FF" stop-opacity=".35"/>
      <stop offset="1" stop-color="#7FA0FF"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#fondo)"/>
  <!-- Ruta entre dos hubs: pasa por detrás de la caja -->
  <path d="M10 51C8 28 26 11 52 13" stroke="url(#ruta)" stroke-width="3.2" stroke-linecap="round"/>
  <!-- Hub de origen (anillo) y de destino (amarillo) -->
