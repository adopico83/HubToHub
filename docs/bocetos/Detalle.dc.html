<!doctype html>

<body>
<x-dc>

<div style="position: relative; overflow: hidden; min-height: 1080px; background: #F2F5FB; font-family: Inter, system-ui, sans-serif; color: #0E1A3A">

  <div style="position: absolute; right: -100px; top: 560px; width: 460px; height: 460px; border-radius: 50%; background: #FFC83D; opacity: 0.65; filter: blur(70px)"></div>
  <div style="position: absolute; left: 240px; top: 760px; width: 420px; height: 420px; border-radius: 50%; background: #FF8F80; opacity: 0.5; filter: blur(70px)"></div>
  <div style="position: absolute; right: 160px; top: 860px; width: 380px; height: 380px; border-radius: 50%; background: #6FE3B5; opacity: 0.55; filter: blur(70px)"></div>
</div>


  <div style="position: relative; overflow: hidden; background: #0E1A3A; color: #FFFFFF; padding-bottom: 120px">
    <div aria-hidden="true" style="position: absolute; right: -140px; top: -190px; width: 480px; height: 480px; border-radius: 50%; background: #2F5BFF"></div>
    <div aria-hidden="true" style="position: absolute; right: 270px; bottom: -90px; width: 170px; height: 170px; border-radius: 50%; background: #FFC83D"></div>
    <div style="position: relative; max-width: 1120px; margin: 0 auto; padding: 0 32px; box-sizing: border-box">
      <header style="height: 88px; display: flex; align-items: center; justify-content: space-between; gap: 16px">
        <a href="Main.dc.html" style="display: flex; align-items: center; gap: 12px; color: #FFFFFF; text-decoration: none">
          <svg width="46" height="46" viewBox="0 0 64 64" fill="none" aria-hidden="true" style="flex: 0 0 46px">
            <rect width="64" height="64" rx="18" fill="#16275A"/>
            <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="17.25" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.5"/>
            <path d="M9 53C6 30 24 9 55 11" stroke="#7FA0FF" stroke-width="3" stroke-linecap="round"/>

            <path d="M32 12L50 22L32 32L14 22Z" fill="#FFE08A"/>
            <path d="M14 22L32 32V52L14 42Z" fill="#FFC83D"/>
            <path d="M32 32L50 22V42L32 52Z" fill="#E39F00"/>
            <path d="M41 17L23 27V47" stroke="#2F5BFF" stroke-width="4" stroke-linejoin="round"/>
          </svg>
          <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 22px; font-weight: 700; letter-spacing: -0.01em">Hub<span style="color: #FFC83D">To</span>Hub</span>
        </a>
        </header>
      <a href="Main.dc.html" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; color: #D5DDF5; font-size: 15px; font-weight: 600; text-decoration: none">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D5DDF5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        Volver a paquetes
      </a>
      <div style="margin-top: 8px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 20px">
        <div style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap">
          <h1 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 48px; line-height: 1.05; font-weight: 700; letter-spacing: -0.03em">Paquete #4</h1>
          <span style="display: inline-block; padding: 7px 16px; border-radius: 999px; font-size: 14px; font-weight: 700; background: #DCE6FF; color: #12307F">En reparto</span>
        </div>
        <button type="button" style="min-height: 48px; padding: 0 20px; border: 2px solid #FF8F80; border-radius: 14px; background: transparent; font: inherit; font-size: 15px; font-weight: 700; color: #FFB4A9; cursor: pointer">Eliminar paquete</button>
      </div>
    </div>
  </div>

  <main style="position: relative; max-width: 1120px; margin: -76px auto 0; padding: 0 32px 64px; box-sizing: border-box">

    <section aria-label="Seguimiento" style="border-radius: 24px; padding: 28px 32px; background: rgba(255,255,255,0.58); backdrop-filter: blur(24px) saturate(170%); -webkit-backdrop-filter: blur(24px) saturate(170%); border: 1px solid rgba(255,255,255,0.85); box-shadow: inset 0 1px 0 rgba(255,255,255,0.95), inset 0 -1px 0 rgba(255,255,255,0.3), 0 14px 34px rgba(14,26,58,0.12)">
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px 32px; justify-content: space-between">
        <div style="min-width: 0">
          <div style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #55607A">De</div>
          <div style="margin-top: 4px; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 22px; font-weight: 700">Logística Debabarrena</div>
        </div>
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#2F5BFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg>
        <div style="min-width: 0">
          <div style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #55607A">Para</div>
          <div style="margin-top: 4px; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 22px; font-weight: 700">Iker Goikoetxea</div>
        </div>
        <div style="min-width: 0">
          <div style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #55607A">Peso</div>
          <div style="margin-top: 4px; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 22px; font-weight: 700">5,0 kg</div>
        </div>
      </div>

      <ol style="list-style: none; margin: 28px 0 0; padding: 0; display: flex; gap: 0">
        <li style="flex: 1; min-width: 0">
          <div style="display: flex; align-items: center">
            <span style="width: 32px; height: 32px; border-radius: 50%; background: #2F5BFF; display: flex; align-items: center; justify-content: center; flex: 0 0 32px">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>
            </span>
            <span aria-hidden="true" style="flex: 1; height: 4px; background: #2F5BFF; margin: 0 6px; border-radius: 2px"></span>
          </div>
          <div style="margin-top: 10px; font-size: 15px; font-weight: 700">Pendiente</div>
          <div style="font-size: 14px; color: #55607A">Registrado el 18/11/2026</div>
        </li>
        <li style="flex: 1; min-width: 0" aria-current="step">
          <div style="display: flex; align-items: center">
            <span style="width: 32px; height: 32px; border-radius: 50%; background: #FFFFFF; border: 4px solid #2F5BFF; box-sizing: border-box; flex: 0 0 32px"></span>
            <span aria-hidden="true" style="flex: 1; height: 4px; background: #D9DFEC; margin: 0 6px; border-radius: 2px"></span>
          </div>
          <div style="margin-top: 10px; font-size: 15px; font-weight: 700; color: #1B3FD1">En reparto</div>
          <div style="font-size: 14px; color: #55607A">Estado actual</div>
        </li>
        <li style="flex: 0 0 auto; min-width: 0">
          <div style="display: flex; align-items: center">
            <span style="width: 32px; height: 32px; border-radius: 50%; background: #FFFFFF; border: 4px solid #D9DFEC; box-sizing: border-box"></span>
          </div>
          <div style="margin-top: 10px; font-size: 15px; font-weight: 700; color: #55607A">Entregado</div>
          <div style="font-size: 14px; color: #55607A">Pendiente</div>
        </li>
      </ol>
    </section>

    <div style="margin-top: 24px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
      <section aria-labelledby="datos" style="flex: 999 1 560px; min-width: 0; border-radius: 24px; padding: 32px; background: rgba(255,255,255,0.58); backdrop-filter: blur(24px) saturate(170%); -webkit-backdrop-filter: blur(24px) saturate(170%); border: 1px solid rgba(255,255,255,0.85); box-shadow: inset 0 1px 0 rgba(255,255,255,0.95), inset 0 -1px 0 rgba(255,255,255,0.3), 0 14px 34px rgba(14,26,58,0.12)">
        <h2 id="datos" style="margin: 0 0 24px; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 24px; font-weight: 700; letter-spacing: -0.01em">Editar datos</h2>
        <form onsubmit="return false" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px">
          <div style="display: flex; flex-direction: column; gap: 8px">
            <label for="f-id" style="font-size: 14px; font-weight: 700">ID</label>
            <input id="f-id" type="text" value="4" readonly style="height: 50px; box-sizing: border-box; padding: 0 16px; border: 1px solid #C9D1E3; border-radius: 14px; background: #F2F5FB; font: inherit; font-size: 16px; color: #55607A">
          </div>
          <div style="display: flex; flex-direction: column; gap: 8px">
            <label for="f-fecha" style="font-size: 14px; font-weight: 700">Fecha de registro</label>
            <input id="f-fecha" type="text" value="18/11/2026" style="height: 50px; box-sizing: border-box; padding: 0 16px; border: 1px solid #8A94AB; border-radius: 14px; background: rgba(255,255,255,0.6); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), inset 0 2px 6px rgba(14,26,58,0.06); font: inherit; font-size: 16px; color: #0E1A3A">
          </div>
          <div style="display: flex; flex-direction: column; gap: 8px">
            <label for="f-rem" style="font-size: 14px; font-weight: 700">Remitente</label>
            <input id="f-rem" type="text" value="Logística Debabarrena" style="height: 50px; box-sizing: border-box; padding: 0 16px; border: 1px solid #8A94AB; border-radius: 14px; background: rgba(255,255,255,0.6); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), inset 0 2px 6px rgba(14,26,58,0.06); font: inherit; font-size: 16px; color: #0E1A3A">
          </div>
          <div style="display: flex; flex-direction: column; gap: 8px">
            <label for="f-dest" style="font-size: 14px; font-weight: 700">Destinatario</label>
            <input id="f-dest" type="text" value="Iker Goikoetxea" style="height: 50px; box-sizing: border-box; padding: 0 16px; border: 1px solid #8A94AB; border-radius: 14px; background: rgba(255,255,255,0.6); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), inset 0 2px 6px rgba(14,26,58,0.06); font: inherit; font-size: 16px; color: #0E1A3A">
          </div>
          <div style="display: flex; flex-direction: column; gap: 8px">
            <label for="f-peso" style="font-size: 14px; font-weight: 700">Peso (kg)</label>
            <input id="f-peso" type="text" value="5,0" style="height: 50px; box-sizing: border-box; padding: 0 16px; border: 1px solid #8A94AB; border-radius: 14px; background: rgba(255,255,255,0.6); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), inset 0 2px 6px rgba(14,26,58,0.06); font: inherit; font-size: 16px; color: #0E1A3A">
          </div>
          <div style="display: flex; flex-direction: column; gap: 8px">
            <label for="f-estado" style="font-size: 14px; font-weight: 700">Estado</label>
            <select id="f-estado" style="height: 50px; box-sizing: border-box; padding: 0 16px; border: 1px solid #8A94AB; border-radius: 14px; background: rgba(255,255,255,0.6); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), inset 0 2px 6px rgba(14,26,58,0.06); font: inherit; font-size: 16px; color: #0E1A3A">
              <option>Pendiente</option>
              <option selected>En reparto</option>
              <option>Entregado</option>
              <option>Incidencia</option>
            </select>
          </div>
          <div style="grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 12px; margin-top: 6px; padding-top: 26px; border-top: 1px solid #E3E8F2">
            <button type="submit" style="min-height: 52px; padding: 0 28px; border: 0; border-radius: 14px; background: #2F5BFF; font: inherit; font-size: 16px; font-weight: 700; color: #FFFFFF; cursor: pointer">Guardar cambios</button>
            <a href="Main.dc.html" style="display: inline-flex; align-items: center; min-height: 52px; padding: 0 26px; box-sizing: border-box; border: 2px solid #C9D1E3; border-radius: 14px; color: #0E1A3A; font-size: 16px; font-weight: 700; text-decoration: none">Cancelar</a>
          </div>
        </form>
      </section>
    </div>
  </main>
</div>
