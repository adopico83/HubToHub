<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Listado de paquetes (móvil)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
body{margin:0}
a{color:#2F5BFF}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1960px; display: flex; flex-direction: column; background: #F2F5FB; font-family: Inter, system-ui, sans-serif; color: #0E1A3A; overflow: hidden">
<div aria-hidden="true" style="position: absolute; top: 0; right: 0; bottom: 0; left: 0; pointer-events: none">
  <div style="position: absolute; left: -120px; top: 420px; width: 340px; height: 340px; border-radius: 50%; background: #7FA0FF; opacity: 0.6; filter: blur(70px)"></div>
  <div style="position: absolute; right: -100px; top: 800px; width: 320px; height: 320px; border-radius: 50%; background: #FFC83D; opacity: 0.65; filter: blur(70px)"></div>
  <div style="position: absolute; left: 240px; top: 1200px; width: 300px; height: 300px; border-radius: 50%; background: #FF8F80; opacity: 0.5; filter: blur(70px)"></div>
  <div style="position: absolute; right: 160px; top: 1500px; width: 300px; height: 300px; border-radius: 50%; background: #6FE3B5; opacity: 0.55; filter: blur(70px)"></div>
</div>


  <div style="position: relative; overflow: hidden; background: #0E1A3A; color: #FFFFFF; padding: 0 20px 64px; border-radius: 0 0 32px 32px">
    <div aria-hidden="true" style="position: absolute; right: -90px; top: -110px; width: 300px; height: 300px; border-radius: 50%; background: #2F5BFF"></div>
    <div aria-hidden="true" style="position: absolute; right: 70px; bottom: -60px; width: 110px; height: 110px; border-radius: 50%; background: #FFC83D"></div>
    <div style="position: relative">
      <header style="height: 72px; display: flex; align-items: center; justify-content: space-between">
        <div style="display: flex; align-items: center; gap: 10px">
          <svg width="42" height="42" viewBox="0 0 64 64" fill="none" aria-hidden="true" style="flex: 0 0 42px">
            <rect width="64" height="64" rx="18" fill="#16275A"/>
            <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="17.25" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.5"/>
            <path d="M9 53C6 30 24 9 55 11" stroke="#7FA0FF" stroke-width="3" stroke-linecap="round"/>
            <circle cx="9" cy="53" r="4.5" fill="#7FA0FF"/>
            <circle cx="55" cy="11" r="4.5" fill="#FFC83D"/>
            <path d="M32 12L50 22L32 32L14 22Z" fill="#FFE08A"/>
            <path d="M14 22L32 32V52L14 42Z" fill="#FFC83D"/>
            <path d="M32 32L50 22V42L32 52Z" fill="#E39F00"/>
            <path d="M41 17L23 27V47" stroke="#2F5BFF" stroke-width="4" stroke-linejoin="round"/>
          </svg>
          <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 20px; font-weight: 700">Hub<span style="color: #FFC83D">To</span>Hub</span>
        </div>
      </header>
      <p style="margin: 12px 0 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #FFC83D">Panel de envíos</p>
      <h1 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 40px; line-height: 1.05; font-weight: 700; letter-spacing: -0.03em">Paquetes</h1>
      <p style="margin: 8px 0 0; font-size: 16px; line-height: 1.5; color: #D5DDF5">Tus envíos registrados.</p>
    </div>
  </div>

  <div style="flex: 1; padding: 0 16px; margin-top: -40px; position: relative">

    <section aria-label="Resumen" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <sc-for list="{{stats}}" as="s" hint-placeholder-count="5">
        <div style="grid-column: {{s.span}}; background: {{s.bg}}; backdrop-filter: blur(24px) saturate(170%); -webkit-backdrop-filter: blur(24px) saturate(170%); border: 1px solid rgba(255,255,255,0.6); box-shadow: inset 0 1px 0 rgba(255,255,255,0.55), 0 14px 30px rgba(14,26,58,0.16); color: {{s.fg}}; border-radius: 18px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between">
          <span style="font-size: 14px; font-weight: 600">{{s.label}}</span>
          <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 32px; line-height: 1; font-weight: 700">{{s.value}}</span>
        </div>
      </sc-for>
    </section>

    <div style="position: relative; margin-top: 20px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#55607A" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="position: absolute; left: 16px; top: 16px"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" aria-label="Buscar paquetes" placeholder="Buscar remitente o destinatario" style="width: 100%; height: 52px; box-sizing: border-box; padding: 0 16px 0 46px; border: 1px solid #8A94AB; border-radius: 16px; background: rgba(255,255,255,0.6); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), inset 0 2px 6px rgba(14,26,58,0.06); font: inherit; font-size: 16px; color: #0E1A3A">
    </div>

    <div role="group" aria-label="Filtrar por estado" style="margin: 12px -16px 0; padding: 0 16px 4px; display: flex; gap: 8px; overflow-x: auto">
      <button type="button" aria-pressed="true" style="flex: 0 0 auto; min-height: 44px; padding: 0 18px; border: 0; border-radius: 999px; background: rgba(14,26,58,0.9); color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 600">Todos</button>
      <button type="button" aria-pressed="false" style="flex: 0 0 auto; min-height: 44px; padding: 0 18px; border: 1px solid rgba(255,255,255,0.85); border-radius: 999px; background: rgba(255,255,255,0.55); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 4px 12px rgba(14,26,58,0.08); color: #0E1A3A; font: inherit; font-size: 15px; font-weight: 600">Pendiente</button>
      <button type="button" aria-pressed="false" style="flex: 0 0 auto; min-height: 44px; padding: 0 18px; border: 1px solid rgba(255,255,255,0.85); border-radius: 999px; background: rgba(255,255,255,0.55); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 4px 12px rgba(14,26,58,0.08); color: #0E1A3A; font: inherit; font-size: 15px; font-weight: 600">En reparto</button>
      <button type="button" aria-pressed="false" style="flex: 0 0 auto; min-height: 44px; padding: 0 18px; border: 1px solid rgba(255,255,255,0.85); border-radius: 999px; background: rgba(255,255,255,0.55); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 4px 12px rgba(14,26,58,0.08); color: #0E1A3A; font: inherit; font-size: 15px; font-weight: 600">Entregado</button>
      <button type="button" aria-pressed="false" style="flex: 0 0 auto; min-height: 44px; padding: 0 18px; border: 1px solid rgba(255,255,255,0.85); border-radius: 999px; background: rgba(255,255,255,0.55); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 4px 12px rgba(14,26,58,0.08); color: #0E1A3A; font: inherit; font-size: 15px; font-weight: 600">Incidencia</button>
    </div>

    <ul style="list-style: none; margin: 16px 0 0; padding: 0; display: flex; flex-direction: column; gap: 12px">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
        <li>
          <a href="Movil-Detalle.dc.html" style="display: block; border-radius: 20px; padding: 16px; text-decoration: none; color: #0E1A3A; background: rgba(255,255,255,0.58); backdrop-filter: blur(24px) saturate(170%); -webkit-backdrop-filter: blur(24px) saturate(170%); border: 1px solid rgba(255,255,255,0.85); box-shadow: inset 0 1px 0 rgba(255,255,255,0.95), inset 0 -1px 0 rgba(255,255,255,0.3), 0 14px 34px rgba(14,26,58,0.12)">
            <div style="display: flex; align-items: center; gap: 12px">
              <div aria-hidden="true" style="flex: 0 0 46px; width: 46px; height: 46px; border-radius: 14px; background: {{r.avBg}}; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 17px; font-weight: 700">{{r.iniciales}}</div>
              <div style="flex: 1; min-width: 0">
                <div style="font-size: 16px; font-weight: 700; line-height: 1.25">{{r.remitente}}</div>
                <div style="margin-top: 2px; font-size: 14px; color: #55607A">Para {{r.destinatario}}</div>
              </div>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#55607A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 20px"><path d="M9 5l7 7-7 7"/></svg>
            </div>
            <div aria-hidden="true" style="margin-top: 14px; display: flex; gap: 4px">
              <div style="flex: 1; height: 8px; border-radius: 4px; background: {{r.b1}}"></div>
              <div style="flex: 1; height: 8px; border-radius: 4px; background: {{r.b2}}"></div>
              <div style="flex: 1; height: 8px; border-radius: 4px; background: {{r.b3}}"></div>
            </div>
            <div style="margin-top: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px">
              <span style="padding: 5px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; background: {{r.chipBg}}; color: {{r.chipFg}}">{{r.estado}}</span>
              <span style="font-size: 14px; color: #55607A; font-variant-numeric: tabular-nums">#{{r.id}} · {{r.peso}} kg · {{r.fecha}}</span>
            </div>
          </a>
        </li>
      </sc-for>
    </ul>
    <p style="margin: 16px 4px 0; font-size: 14px; color: #55607A">Mostrando 7 de 7 paquetes</p>
  </div>

  <div style="padding: 12px 16px 20px; background: rgba(255,255,255,0.7); backdrop-filter: blur(24px) saturate(170%); -webkit-backdrop-filter: blur(24px) saturate(170%); border-top: 1px solid rgba(255,255,255,0.9); box-shadow: 0 -8px 24px rgba(14,26,58,0.08)">
    <a href="Movil-Nuevo.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; border-radius: 16px; background: #FFC83D; color: #0E1A3A; font-size: 17px; font-weight: 700; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0E1A3A" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      Nuevo paquete
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1960}}'>
class Component extends DCLogic {
  renderVals() {
    const chips = {
      'Pendiente':  { chipBg: '#FFE9A8', chipFg: '#5C3B00', b1: '#F2A900', b2: '#D9DFEC', b3: '#D9DFEC' },
      'En reparto': { chipBg: '#DCE6FF', chipFg: '#12307F', b1: '#2F5BFF', b2: '#2F5BFF', b3: '#D9DFEC' },
      'Entregado':  { chipBg: '#CDF3E1', chipFg: '#07503A', b1: '#19A974', b2: '#19A974', b3: '#19A974' },
      'Incidencia': { chipBg: '#FFD9D5', chipFg: '#8A1409', b1: '#E5422F', b2: '#E5422F', b3: '#D9DFEC' }
    };
    const avatars = ['#DCE6FF', '#FFE9A8', '#CDF3E1', '#FFD9D5', '#E9DDFF', '#D2F1F5', '#FFDFC7'];
    const data = [
      { id: 1, remitente: 'Maite Etxeberria', destinatario: 'Jon Agirre', peso: '2,4', estado: 'Entregado', fecha: '03/11/2026' },
      { id: 2, remitente: 'Tienda Urola', destinatario: 'Ane Zubizarreta', peso: '0,8', estado: 'Entregado', fecha: '05/11/2026' },
      { id: 3, remitente: 'Aitor Mendizabal', destinatario: 'Nerea Larrañaga', peso: '12,5', estado: 'En reparto', fecha: '17/11/2026' },
      { id: 4, remitente: 'Logística Debabarrena', destinatario: 'Iker Goikoetxea', peso: '5,0', estado: 'En reparto', fecha: '18/11/2026' },
      { id: 5, remitente: 'Amaia Olazabal', destinatario: 'Unai Arregi', peso: '1,2', estado: 'Pendiente', fecha: '18/11/2026' },
      { id: 6, remitente: 'Ferretería Oria', destinatario: 'Leire Mugika', peso: '22,0', estado: 'Pendiente', fecha: '19/11/2026' },
      { id: 7, remitente: 'Edurne Aranburu', destinatario: 'Xabier Lasa', peso: '3,6', estado: 'Incidencia', fecha: '14/11/2026' }
    ];
    const count = (e) => data.filter((d) => d.estado === e).length;
    return {
      stats: [
        { label: 'Total de paquetes', value: String(data.length), bg: 'rgba(255,255,255,0.62)', fg: '#0E1A3A', span: 'span 2' },
        { label: 'En reparto', value: String(count('En reparto')), bg: 'rgba(47,91,255,0.94)', fg: '#FFFFFF', span: 'auto' },
        { label: 'Pendientes', value: String(count('Pendiente')), bg: 'rgba(255,200,61,0.84)', fg: '#0E1A3A', span: 'auto' },
        { label: 'Entregados', value: String(count('Entregado')), bg: 'rgba(11,107,76,0.92)', fg: '#FFFFFF', span: 'auto' },
        { label: 'Incidencias', value: String(count('Incidencia')), bg: 'rgba(255,107,87,0.86)', fg: '#0E1A3A', span: 'auto' }
      ],
      rows: data.map((d, i) => ({
        ...d,
        ...chips[d.estado],
        avBg: avatars[i % avatars.length],
        iniciales: d.remitente.split(' ').slice(0, 2).map((w) => w[0]).join('').toUpperCase()
      }))
    };
  }
}
</script>
</body>
</html>
