<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Listado de paquetes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
body{margin:0}
a{color:#2F5BFF}a:hover{color:#1B3FD1}
</style>
</helmet>
<div style="position: relative; overflow: hidden; min-height: 1360px; background: #F2F5FB; font-family: Inter, system-ui, sans-serif; color: #0E1A3A">
<div aria-hidden="true" style="position: absolute; top: 0; right: 0; bottom: 0; left: 0; pointer-events: none">
  <div style="position: absolute; left: -120px; top: 520px; width: 520px; height: 520px; border-radius: 50%; background: #7FA0FF; opacity: 0.6; filter: blur(70px)"></div>
  <div style="position: absolute; right: -100px; top: 700px; width: 460px; height: 460px; border-radius: 50%; background: #FFC83D; opacity: 0.65; filter: blur(70px)"></div>
  <div style="position: absolute; left: 240px; top: 980px; width: 420px; height: 420px; border-radius: 50%; background: #FF8F80; opacity: 0.5; filter: blur(70px)"></div>
  <div style="position: absolute; right: 160px; top: 1150px; width: 380px; height: 380px; border-radius: 50%; background: #6FE3B5; opacity: 0.55; filter: blur(70px)"></div>
</div>


  <div style="position: relative; overflow: hidden; background: #0E1A3A; color: #FFFFFF; padding-bottom: 112px">
    <div aria-hidden="true" style="position: absolute; right: -140px; top: -170px; width: 520px; height: 520px; border-radius: 50%; background: #2F5BFF"></div>
    <div aria-hidden="true" style="position: absolute; right: 250px; bottom: -80px; width: 190px; height: 190px; border-radius: 50%; background: #FFC83D"></div>
    <div aria-hidden="true" style="position: absolute; right: 60px; top: 70px; width: 300px; height: 300px; border-radius: 50%; border: 2px dashed rgba(255,255,255,0.35)"></div>
    <div style="position: relative; max-width: 1120px; margin: 0 auto; padding: 0 32px; box-sizing: border-box">
      <header style="height: 88px; display: flex; align-items: center; justify-content: space-between; gap: 16px">
        <div style="display: flex; align-items: center; gap: 12px">
          <svg width="46" height="46" viewBox="0 0 64 64" fill="none" aria-hidden="true" style="flex: 0 0 46px">
            <rect width="64" height="64" rx="18" fill="#16275A"/>
            <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="17.25" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.5"/>
            <path d="M9 53C6 30 24 9 55 11" stroke="#7FA0FF" stroke-width="3" stroke-linecap="round"/>
            <circle cx="9" cy="53" r="4.5" fill="#7FA0FF"/>
            <circle cx="55" cy="11" r="4.5" fill="#FFC83D"/>
            <path d="M32 12L50 22L32 32L14 22Z" fill="#FFE08A"/>
            <path d="M14 22L32 32V52L14 42Z" fill="#FFC83D"/>
            <path d="M32 32L50 22V42L32 52Z" fill="#E39F00"/>
            <path d="M41 17L23 27V47" stroke="#2F5BFF" stroke-width="4" stroke-linejoin="round"/>
          </svg>
          <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 22px; font-weight: 700; letter-spacing: -0.01em">Hub<span style="color: #FFC83D">To</span>Hub</span>
        </div>
        </header>
      <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 24px; padding-top: 28px">
        <div style="max-width: 560px">
          <p style="margin: 0 0 8px; font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #FFC83D">Panel de envíos</p>
          <h1 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 52px; line-height: 1.05; font-weight: 700; letter-spacing: -0.03em">Paquetes</h1>
          <p style="margin: 12px 0 0; font-size: 17px; line-height: 1.5; color: #D5DDF5">Consulta, crea y actualiza los envíos registrados.</p>
        </div>
        <a href="Nuevo.dc.html" style="display: inline-flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 24px; box-sizing: border-box; border-radius: 14px; background: #FFC83D; color: #0E1A3A; font-size: 16px; font-weight: 700; text-decoration: none">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E1A3A" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          Nuevo paquete
        </a>
      </div>
    </div>
  </div>

  <main style="position: relative; max-width: 1120px; margin: -68px auto 0; padding: 0 32px 64px; box-sizing: border-box">

    <section aria-label="Resumen" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px">
      <sc-for list="{{stats}}" as="s" hint-placeholder-count="5">
        <div style="background: {{s.bg}}; backdrop-filter: blur(24px) saturate(170%); -webkit-backdrop-filter: blur(24px) saturate(170%); border: 1px solid rgba(255,255,255,0.6); box-shadow: inset 0 1px 0 rgba(255,255,255,0.55), 0 14px 30px rgba(14,26,58,0.16); color: {{s.fg}}; border-radius: 20px; padding: 20px 22px">
          <div style="font-size: 14px; font-weight: 600; opacity: 0.92">{{s.label}}</div>
          <div style="margin-top: 6px; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 44px; line-height: 1; font-weight: 700; letter-spacing: -0.02em">{{s.value}}</div>
        </div>
      </sc-for>
    </section>

    <div style="margin-top: 32px; display: flex; flex-wrap: wrap; align-items: center; gap: 14px">
      <div style="position: relative; flex: 1 1 300px; max-width: 400px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#55607A" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="position: absolute; left: 16px; top: 15px"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input type="search" aria-label="Buscar paquetes" placeholder="Buscar remitente o destinatario" style="width: 100%; height: 50px; box-sizing: border-box; padding: 0 16px 0 46px; border: 1px solid #8A94AB; border-radius: 14px; background: rgba(255,255,255,0.6); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), inset 0 2px 6px rgba(14,26,58,0.06); font: inherit; font-size: 16px; color: #0E1A3A">
      </div>
      <div role="group" aria-label="Filtrar por estado" style="display: flex; flex-wrap: wrap; gap: 8px">
        <button type="button" aria-pressed="true" style="min-height: 44px; padding: 0 18px; border: 0; border-radius: 999px; background: rgba(14,26,58,0.9); color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Todos</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 18px; border: 1px solid rgba(255,255,255,0.85); border-radius: 999px; background: rgba(255,255,255,0.55); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 4px 12px rgba(14,26,58,0.08); color: #0E1A3A; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Pendiente</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 18px; border: 1px solid rgba(255,255,255,0.85); border-radius: 999px; background: rgba(255,255,255,0.55); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 4px 12px rgba(14,26,58,0.08); color: #0E1A3A; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">En reparto</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 18px; border: 1px solid rgba(255,255,255,0.85); border-radius: 999px; background: rgba(255,255,255,0.55); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 4px 12px rgba(14,26,58,0.08); color: #0E1A3A; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Entregado</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 18px; border: 1px solid rgba(255,255,255,0.85); border-radius: 999px; background: rgba(255,255,255,0.55); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 4px 12px rgba(14,26,58,0.08); color: #0E1A3A; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Incidencia</button>
      </div>
      </div>

    <ul style="list-style: none; margin: 20px 0 0; padding: 0; display: flex; flex-direction: column; gap: 12px">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
        <li style="border-radius: 20px; padding: 18px 22px; display: flex; flex-wrap: wrap; align-items: center; gap: 14px 22px; background: rgba(255,255,255,0.58); backdrop-filter: blur(24px) saturate(170%); -webkit-backdrop-filter: blur(24px) saturate(170%); border: 1px solid rgba(255,255,255,0.85); box-shadow: inset 0 1px 0 rgba(255,255,255,0.95), inset 0 -1px 0 rgba(255,255,255,0.3), 0 14px 34px rgba(14,26,58,0.12)">
          <div aria-hidden="true" style="flex: 0 0 52px; width: 52px; height: 52px; border-radius: 16px; background: {{r.avBg}}; color: #0E1A3A; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 18px; font-weight: 700">{{r.iniciales}}</div>
          <div style="flex: 1 1 260px; min-width: 0">
            <div style="display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap">
              <span style="font-size: 17px; font-weight: 700">{{r.remitente}}</span>
              <span style="font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; color: #55607A">#{{r.id}}</span>
            </div>
            <div style="margin-top: 4px; font-size: 15px; color: #55607A">Para {{r.destinatario}} · {{r.fecha}}</div>
          </div>
          <div aria-hidden="true" style="flex: 0 0 120px; display: flex; gap: 4px">
            <div style="flex: 1; height: 8px; border-radius: 4px; background: {{r.b1}}"></div>
            <div style="flex: 1; height: 8px; border-radius: 4px; background: {{r.b2}}"></div>
            <div style="flex: 1; height: 8px; border-radius: 4px; background: {{r.b3}}"></div>
          </div>
          <div style="flex: 0 0 76px; text-align: right; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums">{{r.peso}} <span style="font-size: 13px; color: #55607A; font-family: Inter, sans-serif; font-weight: 500">kg</span></div>
          <span style="flex: 0 0 auto; min-width: 104px; text-align: center; box-sizing: border-box; padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 700; background: {{r.chipBg}}; color: {{r.chipFg}}">{{r.estado}}</span>
          <div style="flex: 0 0 auto; display: flex; align-items: center; gap: 8px">
            <a href="Detalle.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; box-sizing: border-box; border-radius: 12px; background: #E8EEFF; color: #1B3FD1; font-size: 15px; font-weight: 700; text-decoration: none">Ver y editar</a>
            <button type="button" aria-label="Eliminar paquete {{r.id}}" style="width: 44px; height: 44px; border: 1px solid rgba(243,195,188,0.9); border-radius: 12px; background: rgba(255,255,255,0.55); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.9); cursor: pointer; display: inline-flex; align-items: center; justify-content: center">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B3261E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg>
            </button>
          </div>
        </li>
      </sc-for>
    </ul>

    <p style="margin: 20px 4px 0; font-size: 14px; color: #55607A">Mostrando 7 de 7 paquetes</p>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1360}}'>
class Component extends DCLogic {
  renderVals() {
    const chips = {
      'Pendiente':  { chipBg: '#FFE9A8', chipFg: '#5C3B00', b1: '#F2A900', b2: '#D9DFEC', b3: '#D9DFEC' },
      'En reparto': { chipBg: '#DCE6FF', chipFg: '#12307F', b1: '#2F5BFF', b2: '#2F5BFF', b3: '#D9DFEC' },
      'Entregado':  { chipBg: '#CDF3E1', chipFg: '#07503A', b1: '#19A974', b2: '#19A974', b3: '#19A974' },
      'Incidencia': { chipBg: '#FFD9D5', chipFg: '#8A1409', b1: '#E5422F', b2: '#E5422F', b3: '#D9DFEC' }
    };
    const avatars = ['#DCE6FF', '#FFE9A8', '#CDF3E1', '#FFD9D5', '#E9DDFF', '#D2F1F5', '#FFDFC7'];
    const data = [
      { id: 1, remitente: 'Maite Etxeberria', destinatario: 'Jon Agirre', peso: '2,4', estado: 'Entregado', fecha: '03/11/2026' },
      { id: 2, remitente: 'Tienda Urola', destinatario: 'Ane Zubizarreta', peso: '0,8', estado: 'Entregado', fecha: '05/11/2026' },
      { id: 3, remitente: 'Aitor Mendizabal', destinatario: 'Nerea Larrañaga', peso: '12,5', estado: 'En reparto', fecha: '17/11/2026' },
      { id: 4, remitente: 'Logística Debabarrena', destinatario: 'Iker Goikoetxea', peso: '5,0', estado: 'En reparto', fecha: '18/11/2026' },
      { id: 5, remitente: 'Amaia Olazabal', destinatario: 'Unai Arregi', peso: '1,2', estado: 'Pendiente', fecha: '18/11/2026' },
      { id: 6, remitente: 'Ferretería Oria', destinatario: 'Leire Mugika', peso: '22,0', estado: 'Pendiente', fecha: '19/11/2026' },
      { id: 7, remitente: 'Edurne Aranburu', destinatario: 'Xabier Lasa', peso: '3,6', estado: 'Incidencia', fecha: '14/11/2026' }
    ];
    const count = (e) => data.filter((d) => d.estado === e).length;
    return {
      stats: [
        { label: 'Total', value: String(data.length), bg: 'rgba(255,255,255,0.62)', fg: '#0E1A3A' },
        { label: 'En reparto', value: String(count('En reparto')), bg: 'rgba(47,91,255,0.94)', fg: '#FFFFFF' },
        { label: 'Pendientes', value: String(count('Pendiente')), bg: 'rgba(255,200,61,0.84)', fg: '#0E1A3A' },
        { label: 'Entregados', value: String(count('Entregado')), bg: 'rgba(11,107,76,0.92)', fg: '#FFFFFF' },
        { label: 'Incidencias', value: String(count('Incidencia')), bg: 'rgba(255,107,87,0.86)', fg: '#0E1A3A' }
      ],
      rows: data.map((d, i) => ({
        ...d,
        ...chips[d.estado],
        avBg: avatars[i % avatars.length],
        iniciales: d.remitente.split(' ').slice(0, 2).map((w) => w[0]).join('').toUpperCase()
      }))
    };
  }
}
</script>
</body>
</html>
