          </div>
          <div style="display: flex; flex-direction: column; gap: 8px">
            <label for="n-peso" style="font-size: 14px; font-weight: 700">Peso (kg)</label>
            <input id="n-peso" type="text" placeholder="0,0" style="height: 50px; box-sizing: border-box; padding: 0 16px; border: 1px solid #8A94AB; border-radius: 14px; background: rgba(255,255,255,0.6); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), inset 0 2px 6px rgba(14,26,58,0.06); font: inherit; font-size: 16px; color: #0E1A3A">
          </div>
          <div style="display: flex; flex-direction: column; gap: 8px">
            <label for="n-estado" style="font-size: 14px; font-weight: 700">Estado inicial</label>
            <select id="n-estado" style="height: 50px; box-sizing: border-box; padding: 0 16px; border: 1px solid #8A94AB; border-radius: 14px; background: rgba(255,255,255,0.6); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), inset 0 2px 6px rgba(14,26,58,0.06); font: inherit; font-size: 16px; color: #0E1A3A">
              <option selected>Pendiente</option>
              <option>En reparto</option>
              <option>Entregado</option>
              <option>Incidencia</option>
            </select>
          </div>
          <div style="grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 12px; margin-top: 6px; padding-top: 26px; border-top: 1px solid #E3E8F2">
